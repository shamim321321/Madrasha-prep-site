<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>রক্ষণাবেক্ষণ চলছে — নিবন্ধন হাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background:#F4EEDC; }
  .serif-bn { font-family:'Tiro Bangla', serif; }
  .sans-bn { font-family:'Hind Siliguri', sans-serif; }
  .icon-badge { background:rgba(201,162,76,0.12); }
</style>
</head>
<body class="sans-bn min-h-screen flex items-center justify-center px-6">

  <div class="text-center max-w-sm">
    <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-5" style="background:#0E211C;">
      <i data-lucide="feather" class="w-8 h-8" style="color:#C9A24C;"></i>
    </div>
    <p class="serif-bn text-xl mb-1" style="color:#0E211C;">নিবন্ধন হাব</p>

    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center my-6 icon-badge">
      <i data-lucide="construction" class="w-7 h-7" style="color:#8B6B2A;"></i>
    </div>

    <h1 class="serif-bn text-lg mb-3" style="color:#0E211C;">🚧 সাইটটি বর্তমানে উন্নয়ন ও রক্ষণাবেক্ষণের কাজ চলছে।</h1>
    <p class="text-sm mb-2" style="color:#5B5340;">আরও উন্নত অভিজ্ঞতা দেওয়ার জন্য আমরা নতুন ফিচার যুক্ত করছি। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>

    <p id="return-time" class="hidden text-xs font-semibold mt-3" style="color:#8B6B2A;"></p>
    <p id="custom-message" class="hidden text-sm mt-3" style="color:#5B5340;"></p>

    <a href="https://www.facebook.com/prof355or" target="_blank" class="inline-flex items-center gap-2 mt-7 px-5 py-2.5 rounded-full text-sm font-medium" style="background:#0E211C; color:#F4EEDC;">
      <i data-lucide="facebook" class="w-4 h-4"></i> ফেসবুক পেজ দেখুন
    </a>
  </div>

<script>
  const SUPABASE_URL = "https://laujqfawcirnwsmvhaif.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rlZV0JZUFH7NdmR_-Oz7Dg_97OQxMpv";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadInfo(){
    const { data } = await sb.from('site_settings').select('*').eq('id', 1).maybeSingle();
    if (data?.expected_return) {
      const el = document.getElementById('return-time');
      el.textContent = `প্রত্যাশিত ফেরার সময়: ${data.expected_return}`;
      el.classList.remove('hidden');
    }
    if (data?.maintenance_message) {
      const el = document.getElementById('custom-message');
      el.textContent = data.maintenance_message;
      el.classList.remove('hidden');
    }
    // মেইনটেন্যান্স মোড বন্ধ হয়ে গেলে স্বয়ংক্রিয়ভাবে হোমপেজে ফিরিয়ে নেওয়া
    if (data && !data.maintenance_mode) {
      window.location.href = 'index.html';
    }
  }
  loadInfo();
  lucide.createIcons();
</script>
</body>
</html>
