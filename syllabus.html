<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>সিলেবাস — নিবন্ধন হাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background:#F4EEDC; }
  .serif-bn { font-family:'Tiro Bangla', serif; }
  .sans-bn { font-family:'Hind Siliguri', sans-serif; }
  .icon-badge { background:rgba(201,162,76,0.12); }
  .hidden { display:none; }
  .chevron { transition: transform 0.2s ease; }
  .chevron.open { transform: rotate(90deg); }
</style>
</head>
<body class="sans-bn pb-10">

  <header class="sticky top-0 z-30 flex items-center gap-3 px-5 py-3.5" style="background:#0E211C; border-bottom:1px solid rgba(201,162,76,0.25);">
    <a href="#" onclick="goBack(); return false;" style="color:#F4EEDC;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <div class="serif-bn text-lg" style="color:#F4EEDC;">সিলেবাস</div>
  </header>

  <!-- ধাপ ১: জেনারেল / সাব্জেক্টিভ -->
  <div id="top-picker" class="px-5 mt-6">
    <p class="text-sm mb-4" style="color:#5B5340;">কোন সিলেবাস দেখতে চান?</p>
    <button onclick="showSyllabus('general')" class="w-full flex items-center gap-3 rounded-2xl p-4 mb-3" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 icon-badge"><i data-lucide="layers" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">জেনারেল</p>
        <p class="text-xs" style="color:#5B5340;">বাংলা, ইংরেজি, গণিত, সাধারণ জ্ঞান</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
    <button onclick="showSubjectivePicker()" class="w-full flex items-center gap-3 rounded-2xl p-4" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 icon-badge"><i data-lucide="graduation-cap" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">সাব্জেক্টিভ</p>
        <p class="text-xs" style="color:#5B5340;">প্রভাষক ও সহকারী মৌলভী (আরবি)</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
  </div>

  <!-- ধাপ ২: প্রভাষক / সহকারী মৌলভী -->
  <div id="subjective-picker" class="hidden px-5 mt-6">
    <p class="text-sm mb-4" style="color:#5B5340;">কোন পদের সিলেবাস দেখতে চান?</p>
    <button onclick="showSyllabus('provashok')" class="w-full flex items-center gap-3 rounded-2xl p-4 mb-3" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 icon-badge"><i data-lucide="book-marked" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">প্রভাষক (আরবি)</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
    <button onclick="showSyllabus('sohokari_moulvi')" class="w-full flex items-center gap-3 rounded-2xl p-4" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 icon-badge"><i data-lucide="book-marked" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">সহকারী মৌলভী (আরবি)</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
  </div>

  <!-- ধাপ ৩: সিলেবাস কন্টেন্ট (অ্যাকর্ডিয়ন) -->
  <div id="syllabus-content" class="hidden px-5 mt-6">
    <p id="syllabus-title" class="serif-bn text-lg mb-4" style="color:#0E211C;"></p>
    <div id="syllabus-list" class="flex flex-col gap-2.5"></div>
    <p id="syllabus-loading" class="text-sm text-center py-6" style="color:#8A8266;">লোড হচ্ছে...</p>
  </div>

<script>
  const SUPABASE_URL = "https://laujqfawcirnwsmvhaif.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rlZV0JZUFH7NdmR_-Oz7Dg_97OQxMpv";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentView = 'top-picker';

  function showEl(id){
    document.querySelectorAll('#top-picker,#subjective-picker,#syllabus-content').forEach(e=>e.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    currentView = id;
  }

  function goBack(){
    if (currentView === 'syllabus-content') { showEl(lastPickerView); }
    else if (currentView === 'subjective-picker') { showEl('top-picker'); }
    else { window.location.href = 'library.html'; }
  }

  let lastPickerView = 'top-picker';

  function showSubjectivePicker(){
    lastPickerView = 'top-picker';
    showEl('subjective-picker');
  }

  const syllabusTitles = {
    general: 'জেনারেল সিলেবাস',
    provashok: 'প্রভাষক (আরবি) সিলেবাস',
    sohokari_moulvi: 'সহকারী মৌলভী (আরবি) সিলেবাস'
  };

  async function showSyllabus(key){
    lastPickerView = key === 'general' ? 'top-picker' : 'subjective-picker';
    showEl('syllabus-content');
    document.getElementById('syllabus-title').textContent = syllabusTitles[key];
    const list = document.getElementById('syllabus-list');
    const loading = document.getElementById('syllabus-loading');
    list.innerHTML = '';
    loading.classList.remove('hidden');

    const { data, error } = await sb.from('syllabus_topics').select('*').eq('syllabus', key).order('sort_order');
    loading.classList.add('hidden');

    if (error || !data || data.length === 0) {
      list.innerHTML = `<p class="text-sm text-center py-6" style="color:#8A8266;">সিলেবাস এখনো যোগ করা হয়নি।</p>`;
      return;
    }

    // subject -> chapter -> [topics]  (chapter নাল হলে subject নিজেই একটা ফ্ল্যাট লিস্ট)
    const bySubject = {};
    data.forEach(row => {
      if (!bySubject[row.subject]) bySubject[row.subject] = { hasChapters: false, chapters: {}, flat: [] };
      if (row.chapter) {
        bySubject[row.subject].hasChapters = true;
        if (!bySubject[row.subject].chapters[row.chapter]) bySubject[row.subject].chapters[row.chapter] = [];
        bySubject[row.subject].chapters[row.chapter].push(row.topic);
      } else {
        bySubject[row.subject].flat.push(row.topic);
      }
    });

    let html = '';
    let sIdx = 0;
    for (const subject in bySubject) {
      sIdx++;
      const sId = `s${sIdx}`;
      const info = bySubject[subject];
      html += `
      <div class="rounded-2xl overflow-hidden" style="background:#fff;">
        <button onclick="toggleAccordion('${sId}')" class="w-full flex items-center justify-between px-4 py-3.5">
          <span class="text-sm font-semibold" style="color:#0E211C;">${subject}</span>
          <i data-lucide="chevron-right" id="chev-${sId}" class="chevron w-4 h-4" style="color:#8A8266;"></i>
        </button>
        <div id="body-${sId}" class="hidden px-4 pb-4">`;

      if (info.hasChapters) {
        let cIdx = 0;
        for (const chapter in info.chapters) {
          cIdx++;
          const cId = `${sId}c${cIdx}`;
          html += `
          <div class="mb-2 rounded-xl" style="background:#F9F5E8;">
            <button onclick="toggleAccordion('${cId}')" class="w-full flex items-center justify-between px-3 py-2.5">
              <span class="text-xs font-semibold" style="color:#5B5340;">${chapter}</span>
              <i data-lucide="chevron-right" id="chev-${cId}" class="chevron w-3.5 h-3.5" style="color:#8A8266;"></i>
            </button>
            <div id="body-${cId}" class="hidden px-3 pb-2.5">
              <ul class="list-disc list-inside space-y-1">
                ${info.chapters[chapter].map(t => `<li class="text-xs" style="color:#5B5340;">${t}</li>`).join('')}
              </ul>
            </div>
          </div>`;
        }
      } else {
        html += `
        <ul class="list-disc list-inside space-y-1">
          ${info.flat.map(t => `<li class="text-xs" style="color:#5B5340;">${t}</li>`).join('')}
        </ul>`;
      }

      html += `</div></div>`;
    }

    list.innerHTML = html;
    lucide.createIcons();
  }

  function toggleAccordion(id){
    const body = document.getElementById(`body-${id}`);
    const chev = document.getElementById(`chev-${id}`);
    body.classList.toggle('hidden');
    chev.classList.toggle('open');
  }

  lucide.createIcons();
</script>
</body>
</html>
