<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { background:#F4EEDC; }
  .serif-bn { font-family:'Tiro Bangla', serif; }
  .sans-bn { font-family:'Hind Siliguri', sans-serif; }
  .icon-badge { background:rgba(209,67,67,0.12); }
</style>
</head>
<body class="sans-bn min-h-screen flex items-center justify-center px-6">

  <div class="text-center max-w-sm">
    <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-5" style="background:#0E211C;">
      <i data-lucide="feather" class="w-8 h-8" style="color:#C9A24C;"></i>
    </div>
    <p class="serif-bn text-xl mb-1" style="color:#0E211C;">নিবন্ধন হাব</p>

    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center my-6 icon-badge">

    <h1 class="serif-bn text-lg mb-3" style="color:#0E211C;">এই একাউন্টের অ্যাক্সেস সাময়িকভাবে বন্ধ করা হয়েছে</h1>
    <p class="text-sm mb-6" style="color:#5B5340;">নীতিমালা লঙ্ঘনের কারণে এই একাউন্ট দিয়ে সাইট ব্যবহার করা যাচ্ছে না। এটি ভুল মনে হলে যোগাযোগ করুন।</p>

    <a href="contact.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style="background:#0E211C; color:#F4EEDC;">
      <i data-lucide="message-circle" class="w-4 h-4"></i> যোগাযোগ করুন
    </a>
  </div>

<script>lucide.createIcons();</script>

</html>
