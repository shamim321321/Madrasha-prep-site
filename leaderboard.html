<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard — GenMCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background:#F4EEDC; }
.serif-bn { font-family:'Tiro Bangla', serif; }
.sans-bn { font-family:'Hind Siliguri', sans-serif; }
.num-bn { font-family:'Noto Sans Bengali', sans-serif; font-weight:700; }
.btn-gold { background:#C9A24C; color:#0E211C; }
</style>
</head>
<body class="sans-bn pb-10">
<header class="sticky top-0 z-30 flex items-center gap-3 px-5 py-3.5" style="background:#0E211C; border-bottom:1px solid rgba(201,162,76,0.25);">
<a href="index.html" style="color:#F4EEDC;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
<div class="serif-bn text-lg" style="color:#F4EEDC;">Leaderboard</div>
</header>

<!-- TABS: এই সপ্তাহ / সর্বকালের সেরা -->
<div class="flex gap-2 px-5 mt-5 mb-2">
<button id="tab-week" onclick="switchTab('week')" class="flex-1 py-2 rounded-full text-xs font-semibold" style="background:#0E211C; color:#F4EEDC;">এই সপ্তাহ</button>
<button id="tab-all" onclick="switchTab('all')" class="flex-1 py-2 rounded-full text-xs font-semibold" style="background:#fff; color:#5B5340; border:1px solid #E4DAB8;">সর্বকালের সেরা</button>
</div>

<div id="loading-msg" class="text-center text-sm py-10" style="color:#5B5340;">লোড হচ্ছে...</div>

<div id="empty-msg" class="hidden px-5 mt-16 text-center">
<i data-lucide="trophy" class="w-10 h-10 mx-auto mb-3" style="color:#C9A24C;"></i>
<p class="text-sm" style="color:#5B5340;">এখনো কোনো অনুশীলনের ফলাফল জমা হয়নি — সবার আগে অনুশীলন করে তালিকায় নাম তুলুন!</p>
</div>

<!-- TOP 3 PODIUM -->
<div id="podium" class="hidden px-5 mt-6 flex items-end justify-center gap-3"></div>

<!-- REST OF LIST -->
<div id="rest-list" class="hidden px-5 mt-6 flex flex-col gap-2.5"></div>

<!-- MY RANK (sticky bottom, if not in visible list) -->
<div id="my-rank-bar" class="hidden fixed bottom-0 left-0 right-0 px-5 py-3 flex items-center gap-3" style="background:#16332B; border-top:1px solid rgba(201,162,76,0.3);"></div>

<script src="auth.js"></script>
<script>
let currentTab = 'week';
let currentUserId = null;

function switchTab(tab){
currentTab = tab;
document.getElementById('tab-week').style.background = tab === 'week' ? '#0E211C' : '#fff';
document.getElementById('tab-week').style.color = tab === 'week' ? '#F4EEDC' : '#5B5340';
document.getElementById('tab-week').style.border = tab === 'week' ? 'none' : '1px solid #E4DAB8';
document.getElementById('tab-all').style.background = tab === 'all' ? '#0E211C' : '#fff';
document.getElementById('tab-all').style.color = tab === 'all' ? '#F4EEDC' : '#5B5340';
document.getElementById('tab-all').style.border = tab === 'all' ? 'none' : '1px solid #E4DAB8';
loadLeaderboard();
}

function toBanglaDigits(n){
const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
return n.toString().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
}

async function loadLeaderboard(){
document.getElementById('loading-msg').classList.remove('hidden');
document.getElementById('empty-msg').classList.add('hidden');
document.getElementById('podium').classList.add('hidden');
document.getElementById('rest-list').classList.add('hidden');
document.getElementById('my-rank-bar').classList.add('hidden');

const { data: { session } } = await supabaseClient.auth.getSession();
currentUserId = session && session.user ? session.user.id : null;

let query = supabaseClient.from('quiz_attempts').select('user_id, display_name, avatar_url, total_questions, correct_count, created_at');
if (currentTab === 'week') {
const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
query = query.gte('created_at', weekAgo);
}
const { data, error } = await query;

document.getElementById('loading-msg').classList.add('hidden');

if (error || !data || data.length === 0) {
document.getElementById('empty-msg').classList.remove('hidden');
return;
}

// প্রতিটা ইউজারের সব attempt একসাথে যোগ করে র‍্যাংকিং তৈরি
const byUser = {};
data.forEach(row => {
const uid = row.user_id;
if (!byUser[uid]) {
byUser[uid] = {
user_id: uid,
name: row.display_name || 'একজন শিক্ষার্থী',
avatar: row.avatar_url || null,
total: 0,
correct: 0
};
}
// পরে জমা হওয়া সারি থেকে সর্বশেষ নাম/ছবি ব্যবহার করা (নাম বদলালে আপডেট থাকে)
if (new Date(row.created_at) >= new Date(byUser[uid]._lastDate || 0)) {
byUser[uid].name = row.display_name || byUser[uid].name;
byUser[uid].avatar = row.avatar_url || byUser[uid].avatar;
byUser[uid]._lastDate = row.created_at;
}
byUser[uid].total += row.total_questions;
byUser[uid].correct += row.correct_count;
});

const ranked = Object.values(byUser)
.map(u => ({ ...u, accuracy: u.total ? Math.round((u.correct / u.total) * 100) : 0 }))
.sort((a, b) => b.correct - a.correct || b.accuracy - a.accuracy)
.slice(0, 50);

renderPodium(ranked.slice(0, 3));
renderRest(ranked.slice(3));
renderMyRank(ranked);
lucide.createIcons();
}

function avatarHtml(u, size){
return u.avatar
? `<img src="${u.avatar}" class="rounded-full object-cover" style="width:${size}px;height:${size}px;">`
: `<div class="rounded-full flex items-center justify-center btn-gold" style="width:${size}px;height:${size}px;"><span class="font-bold">${(u.name||'?').trim().charAt(0).toUpperCase()}</span></div>`;
}

function renderPodium(top3){
const wrap = document.getElementById('podium');
if (top3.length === 0) { wrap.classList.add('hidden'); return; }
wrap.classList.remove('hidden');
const order = [top3[1], top3[0], top3[2]]; // ২য়, ১ম, ৩য় ক্রমে সাজানো (মাঝে ১ম)
const heights = [90, 115, 75];
const medalColor = ['#B8B8B8', '#C9A24C', '#B87333'];
const medalIdx = [1, 0, 2];
wrap.innerHTML = order.map((u, i) => {
if (!u) return '<div class="flex-1"></div>';
const rank = medalIdx[i] + 1;
return `
<div class="flex-1 flex flex-col items-center gap-1.5">
<div class="relative">
${avatarHtml(u, i === 1 ? 64 : 52)}
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold" style="background:${medalColor[medalIdx[i]]}; color:#0E211C;">${toBanglaDigits(rank)}</div>
</div>
<p class="text-xs font-semibold text-center truncate w-full" style="color:#0E211C; max-width:90px;">${u.name}</p>
<div class="w-full rounded-t-lg flex items-end justify-center pb-1" style="height:${heights[i]}px; background:${medalColor[medalIdx[i]]}22; border-top:3px solid ${medalColor[medalIdx[i]]};">
<span class="text-[11px] font-bold" style="color:#0E211C;">${toBanglaDigits(u.correct)}</span>
</div>
</div>`;
}).join('');
}

function renderRest(rest){
const wrap = document.getElementById('rest-list');
if (rest.length === 0) { wrap.classList.add('hidden'); return; }
wrap.classList.remove('hidden');
wrap.innerHTML = rest.map((u, i) => {
const rank = i + 4;
const isMe = u.user_id === currentUserId;
return `
<div class="rounded-2xl p-3 flex items-center gap-3" style="background:${isMe ? '#FBF0DC' : '#fff'}; ${isMe ? 'border:1px solid #C9A24C;' : ''}">
<span class="text-sm font-bold w-6 text-center" style="color:#8A8266;">${toBanglaDigits(rank)}</span>
${avatarHtml(u, 38)}
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold truncate" style="color:#0E211C;">${u.name}${isMe ? ' (আপনি)' : ''}</p>
<p class="text-[11px]" style="color:#8A8266;">${u.accuracy}% সঠিক</p>
</div>
<span class="text-sm font-bold" style="color:#2F7A4F;">${toBanglaDigits(u.correct)}</span>
</div>`;
}).join('');
}

function renderMyRank(ranked){
if (!currentUserId) return;
const idx = ranked.findIndex(u => u.user_id === currentUserId);
if (idx === -1 || idx < 3) return; // টপ ৩-এ থাকলে বা তালিকায় না থাকলে আলাদা বার দরকার নেই
const u = ranked[idx];
const bar = document.getElementById('my-rank-bar');
bar.classList.remove('hidden');
bar.innerHTML = `
<span class="text-sm font-bold w-6 text-center" style="color:#C9A24C;">${toBanglaDigits(idx + 1)}</span>
${avatarHtml(u, 34)}
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold truncate" style="color:#F4EEDC;">আপনার অবস্থান</p>
</div>
<span class="text-sm font-bold" style="color:#E4C97A;">${toBanglaDigits(u.correct)} সঠিক</span>`;
}

lucide.createIcons();
loadLeaderboard();
</script>
</body>
</html>
