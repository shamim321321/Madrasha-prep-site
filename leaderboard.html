<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard — GenMCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background:#F4EEDC; }
.serif-bn { font-family:'Tiro Bangla', serif; }
.sans-bn { font-family:'Hind Siliguri', sans-serif; }
.num-bn { font-family:'Noto Sans Bengali', sans-serif; font-weight:700; }
.btn-gold { background:#C9A24C; color:#0E211C; }
.rank-card { background:#fff; border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; border-left:4px solid #E4DAB8; }
.pill { font-size:11px; padding:3px 9px; border-radius:999px; background:#F0EAD6; color:#5B5340; }
</style>
</head>
<body class="sans-bn pb-10">
<header class="sticky top-0 z-30 flex items-center gap-3 px-5 py-3.5" style="background:#0E211C; border-bottom:1px solid rgba(201,162,76,0.25);">
<a href="index.html" style="color:#F4EEDC;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
<div class="serif-bn text-lg" style="color:#F4EEDC;">Leaderboard</div>
</header>

<div class="flex gap-2 px-5 mt-5 mb-5">
<button id="tab-week" onclick="switchTab('week')" class="flex-1 py-2 rounded-full text-xs font-semibold" style="background:#0E211C; color:#F4EEDC;">এই সপ্তাহ</button>
<button id="tab-all" onclick="switchTab('all')" class="flex-1 py-2 rounded-full text-xs font-semibold" style="background:#fff; color:#5B5340; border:1px solid #E4DAB8;">সর্বকালের সেরা</button>
</div>

<div id="loading-msg" class="text-center text-sm py-10" style="color:#5B5340;">লোড হচ্ছে...</div>

<div id="empty-msg" class="hidden px-5 mt-16 text-center">
<i data-lucide="trophy" class="w-10 h-10 mx-auto mb-3" style="color:#C9A24C;"></i>
<p class="text-sm" style="color:#5B5340;">এখনো কোনো অনুশীলনের ফলাফল জমা হয়নি — সবার আগে অনুশীলন করে তালিকায় নাম তুলুন!</p>
</div>

<div id="rank-list" class="hidden px-5 flex flex-col gap-3"></div>

<div id="my-rank-bar" class="hidden fixed bottom-0 left-0 right-0 px-5 py-3 flex items-center gap-3" style="background:#16332B; border-top:1px solid rgba(201,162,76,0.3);"></div>

<script src="auth.js"></script>
<script>
let currentTab = 'week';
let currentUserId = null;

function switchTab(tab){
currentTab = tab;
document.getElementById('tab-week').style.background = tab === 'week' ? '#0E211C' : '#fff';
document.getElementById('tab-week').style.color = tab === 'week' ? '#F4EEDC' : '#5B5340';
document.getElementById('tab-week').style.border = tab === 'week' ? 'none' : '1px solid #E4DAB8';
document.getElementById('tab-all').style.background = tab === 'all' ? '#0E211C' : '#fff';
document.getElementById('tab-all').style.color = tab === 'all' ? '#F4EEDC' : '#5B5340';
document.getElementById('tab-all').style.border = tab === 'all' ? 'none' : '1px solid #E4DAB8';
loadLeaderboard();
}

function toBanglaDigits(n){
const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
return n.toString().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
}

async function loadLeaderboard(){
document.getElementById('loading-msg').classList.remove('hidden');
document.getElementById('empty-msg').classList.add('hidden');
document.getElementById('rank-list').classList.add('hidden');
document.getElementById('my-rank-bar').classList.add('hidden');

const { data: { session } } = await supabaseClient.auth.getSession();
currentUserId = session && session.user ? session.user.id : null;

let query = supabaseClient.from('quiz_attempts').select('user_id, display_name, avatar_url, total_questions, correct_count, created_at');
if (currentTab === 'week') {
const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
query = query.gte('created_at', weekAgo);
}
const { data, error } = await query;

document.getElementById('loading-msg').classList.add('hidden');

if (error || !data || data.length === 0) {
document.getElementById('empty-msg').classList.remove('hidden');
return;
}

const byUser = {};
data.forEach(row => {
const uid = row.user_id;
if (!byUser[uid]) {
byUser[uid] = { user_id: uid, name: row.display_name || 'একজন শিক্ষার্থী', avatar: row.avatar_url || null, total: 0, correct: 0, testCount: 0, _lastDate: null };
}
const u = byUser[uid];
if (!u._lastDate || new Date(row.created_at) >= new Date(u._lastDate)) {
if (row.display_name) u.name = row.display_name;
if (row.avatar_url) u.avatar = row.avatar_url;
u._lastDate = row.created_at;
}
u.total += row.total_questions;
u.correct += row.correct_count;
u.testCount += 1;
});

const ranked = Object.values(byUser)
.map(u => {
const wrong = u.total - u.correct;
const points = Math.max(0, u.correct - wrong * 0.25);
const accuracy = u.total ? Math.round((points / u.total) * 100) : 0;
return { ...u, accuracy, points: Math.round(points * 100) / 100 };
})
.sort((a, b) => b.points - a.points)
.slice(0, 50);

renderList(ranked);
renderMyRank(ranked);
lucide.createIcons();
}

function avatarHtml(u, size){
return u.avatar
? `<img src="${u.avatar}" class="rounded-full object-cover shrink-0" style="width:${size}px;height:${size}px;">`
: `<div class="rounded-full flex items-center justify-center btn-gold shrink-0" style="width:${size}px;height:${size}px;"><span class="font-bold">${(u.name||'?').trim().charAt(0).toUpperCase()}</span></div>`;
}

function rankBadge(rank){
if (rank === 1) return { border: '#C9A24C', icon: '🏆' };
if (rank === 2) return { border: '#B8B8B8', icon: '🥈' };
if (rank === 3) return { border: '#B87333', icon: '🥉' };
return { border: '#16332B', icon: null };
}

function formatPoints(p){
return p % 1 === 0 ? toBanglaDigits(p) : toBanglaDigits(p.toFixed(2));
}

function renderList(ranked){
const wrap = document.getElementById('rank-list');
if (ranked.length === 0) { wrap.classList.add('hidden'); return; }
wrap.classList.remove('hidden');
wrap.innerHTML = ranked.map((u, i) => {
const rank = i + 1;
const badge = rankBadge(rank);
const isMe = u.user_id === currentUserId;
return `
<div class="rank-card" style="border-left-color:${badge.border}; ${isMe ? 'background:#FBF0DC;' : ''}">
<div class="w-7 text-center shrink-0">
${badge.icon ? `<span style="font-size:20px;">${badge.icon}</span>` : `<span class="text-base font-bold" style="color:#8A8266;">${toBanglaDigits(rank)}.</span>`}
</div>
${avatarHtml(u, 46)}
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold truncate" style="color:#0E211C;">${u.name}${isMe ? ' (আপনি)' : ''}</p>
<div class="flex gap-1.5 mt-1.5">
<span class="pill">টেস্ট: ${toBanglaDigits(u.testCount)}</span>
<span class="pill" style="background:#DFF3E3; color:#1E5C36;">গড়: ${toBanglaDigits(u.accuracy)}%</span>
</div>
</div>
<div class="text-right shrink-0">
<p class="text-[10px]" style="color:#8A8266;">পয়েন্ট</p>
<p class="text-lg font-bold" style="color:#0E211C;">${formatPoints(u.points)}</p>
</div>
</div>`;
}).join('');
}

function renderMyRank(ranked){
if (!currentUserId) return;
const idx = ranked.findIndex(u => u.user_id === currentUserId);
if (idx === -1) return;
const u = ranked[idx];
const bar = document.getElementById('my-rank-bar');
bar.classList.remove('hidden');
bar.innerHTML = `
<span class="text-sm font-bold w-6 text-center" style="color:#C9A24C;">${toBanglaDigits(idx + 1)}</span>
${avatarHtml(u, 34)}
<div class="flex-1 min-w-0">
<p class="text-sm font-semibold truncate" style="color:#F4EEDC;">আপনার অবস্থান</p>
</div>
<span class="text-sm font-bold" style="color:#E4C97A;">${formatPoints(u.points)} পয়েন্ট</span>`;
}

lucide.createIcons();
loadLeaderboard();
</script>
</body>
</html>
