<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ফ্রি পরীক্ষা — নিবন্ধন হাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { background:#F4EEDC; }
  .serif-bn { font-family:'Tiro Bangla', serif; }
  .sans-bn { font-family:'Hind Siliguri', sans-serif; }
  .btn-gold { background:#C9A24C; color:#0E211C; }
  .btn-navy { background:#0E211C; color:#F4EEDC; }
</style>
</head>
<body class="sans-bn pb-10">

  <header class="sticky top-0 z-30 flex items-center gap-3 px-5 py-3.5" style="background:#0E211C; border-bottom:1px solid rgba(201,162,76,0.25);">
    <a href="courses.html" style="color:#F4EEDC;"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <div class="serif-bn text-lg" style="color:#F4EEDC;">ফ্রি পরীক্ষা</div>
  </header>

  <div class="px-6 pt-8 pb-6 text-center">
    <h1 class="serif-bn text-2xl mb-2" style="color:#0E211C;">ফ্রি পরীক্ষা</h1>
    <p class="text-sm" style="color:#5B5340;">পরীক্ষা দিতে লগইন দরকার নেই। নাম ও নম্বর দিয়ে পরীক্ষা দিন এবং মেরিট লিস্টে নিজের অবস্থান দেখুন।</p>
  </div>

  <div id="groups" class="px-4 flex flex-col gap-5"></div>

  <div id="notice-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center px-5" style="background:rgba(0,0,0,0.6);" onclick="if(event.target===this) closeNotice()">
    <div class="w-full max-w-sm rounded-2xl p-6 relative text-center" style="background:#16332B; border:1px solid rgba(201,162,76,0.3);">
      <button onclick="closeNotice()" class="absolute top-4 right-4" style="color:#DCD3B6;"><i data-lucide="x" class="w-4 h-4"></i></button>
      <i data-lucide="clock" class="w-8 h-8 mx-auto mb-3" style="color:#C9A24C;"></i>
      <p class="text-sm" style="color:#F4EEDC;">পরীক্ষা সিস্টেম শীঘ্রই চালু হচ্ছে।</p>
    </div>
  </div>

<script src="data.js"></script>
<script>
  const freeExams = [
    { subject: "আরবি প্রভাষক সাবজেক্টিভ কোর্স", items: [
      { title: "ফিকহ", marks: 20, duration: "১৩ মিনিট", topic: "كتاب الكراهية" },
      { title: "উসূলুত তাফসির ও হাদিস", marks: 20, duration: "১৩ মিনিট", topic: "উসূলুত তাফসির, কিতাবুল হুদুদ" }
    ]},
    { subject: "সহকারী মৌলভী সাবজেক্টিভ কোর্স", items: [
      { title: "আরবি সাহিত্য ও হাদিস", marks: 20, duration: "১৩ মিনিট", topic: "কিতাবুস সাওম, খুতবাতুর রাসূল (স)" }
    ]}
  ];

  document.getElementById('groups').innerHTML = freeExams.map(g => `
    <div>
      <p class="text-sm font-semibold mb-2.5" style="color:#8B6B2A;">${g.subject} (${g.items.length})</p>
      <div class="flex flex-col gap-3">
        ${g.items.map(e => `
          <div class="rounded-2xl p-4" style="background:#fff;">
            <h4 class="serif-bn text-base mb-1.5" style="color:#0E211C;">${e.title}</h4>
            <p class="text-xs mb-1" style="color:#5B5340;">পূর্ণমান: ${e.marks} · সময়: ${e.duration}</p>
            <p class="text-xs mb-3" style="color:#5B5340;">টপিক: ${e.topic}</p>
            <div class="flex gap-2">
              <button onclick="openNotice()" class="flex-1 py-2.5 rounded-full text-xs font-semibold" style="border:1px solid #C9A24C; color:#8B6B2A;">মেরিট লিস্ট</button>
              <button onclick="openNotice()" class="flex-1 py-2.5 rounded-full text-xs font-semibold btn-navy flex items-center justify-center gap-1"><i data-lucide="play-circle" class="w-3.5 h-3.5"></i>পরীক্ষা দিন</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  function openNotice(){ document.getElementById('notice-modal').classList.remove('hidden'); }
  function closeNotice(){ document.getElementById('notice-modal').classList.add('hidden'); }

  lucide.createIcons();
</script>
</body>
</html>
