<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>অনুশীলন — নিবন্ধন হাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background:#F4EEDC; }
  .serif-bn { font-family:'Tiro Bangla', serif; }
  .sans-bn { font-family:'Hind Siliguri', sans-serif; }
  .num-bn { font-family:'Noto Sans Bengali', sans-serif; font-weight:700; }
  .btn-gold { background:#C9A24C; color:#0E211C; }
  .opt-btn { background:#fff; border:1px solid #E4DAB8; }
</style>
</head>
<body class="sans-bn pb-10">

  <header class="sticky top-0 z-30 flex items-center gap-3 px-5 py-3.5" style="background:#0E211C; border-bottom:1px solid rgba(201,162,76,0.25);">
    <button onclick="goBack()" style="color:#F4EEDC;"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
    <div class="serif-bn text-lg" style="color:#F4EEDC;">অনুশীলন</div>
  </header>

  <!-- MODE SELECT -->
  <div id="mode-select" class="px-5 mt-6">
    <h2 class="serif-bn text-lg mb-4" style="color:#0E211C;">কীভাবে অনুশীলন করবেন?</h2>
    <button onclick="showCountPicker('random')" class="w-full flex items-center gap-3 rounded-2xl p-4 mb-3" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style="background:rgba(201,162,76,0.12);"><i data-lucide="shuffle" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">র‍্যান্ডম অনুশীলন</p>
        <p class="text-xs" style="color:#5B5340;">সব বিষয় থেকে এলোমেলোভাবে প্রশ্ন</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
    <button onclick="showSubjectPicker()" class="w-full flex items-center gap-3 rounded-2xl p-4" style="background:#fff;">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style="background:rgba(201,162,76,0.12);"><i data-lucide="layers" class="w-5 h-5" style="color:#8B6B2A;"></i></div>
      <div class="text-left flex-1">
        <p class="text-sm font-semibold" style="color:#0E211C;">বিষয়ভিত্তিক অনুশীলন</p>
        <p class="text-xs" style="color:#5B5340;">নির্দিষ্ট একটা বিষয়ের প্রশ্ন</p>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4" style="color:#8A8266;"></i>
    </button>
  </div>

  <!-- SUBJECT PICKER -->
  <div id="subject-picker" class="hidden px-5 mt-6">
    <h2 class="serif-bn text-lg mb-4" style="color:#0E211C;">বিষয় বেছে নিন</h2>
    <div id="subject-list" class="flex flex-col gap-2.5"></div>
  </div>

  <!-- COUNT PICKER -->
  <div id="count-picker" class="hidden px-5 mt-6">
    <h2 class="serif-bn text-lg mb-4" style="color:#0E211C;">কয়টি প্রশ্ন?</h2>
    <div class="grid grid-cols-3 gap-3">
      <button onclick="startQuiz(10)" class="py-4 rounded-2xl text-sm font-semibold" style="background:#fff; color:#0E211C;">১০টি</button>
      <button onclick="startQuiz(20)" class="py-4 rounded-2xl text-sm font-semibold" style="background:#fff; color:#0E211C;">২০টি</button>
      <button onclick="startQuiz(30)" class="py-4 rounded-2xl text-sm font-semibold" style="background:#fff; color:#0E211C;">৩০টি</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz-area" class="hidden px-5 mt-5">
    <div class="flex items-center justify-between mb-3">
      <span id="q-progress" class="text-xs font-medium" style="color:#5B5340;"></span>
      <span id="q-score" class="text-xs font-medium" style="color:#8B6B2A;"></span>
    </div>
    <div class="w-full rounded-full h-1.5 mb-5" style="background:#E4DAB8;">
      <div id="progress-bar" class="h-1.5 rounded-full" style="background:#C9A24C; width:0%;"></div>
    </div>
    <div class="rounded-2xl p-4 mb-4" style="background:#fff;">
      <span id="q-subject-tag" class="text-[11px] px-2 py-0.5 rounded-full" style="background:#0E211C; color:#E4C97A;"></span>
      <p id="q-text" class="text-base mt-2.5 leading-relaxed" style="color:#0E211C;"></p>
    </div>
    <div id="options-wrap" class="flex flex-col gap-2.5"></div>
    <div id="explanation-box" class="hidden mt-4 rounded-xl p-3.5" style="background:#FBF0DC; border:1px solid #E8CE94;">
      <p class="text-xs font-semibold mb-1" style="color:#6B5A2E;">ব্যাখ্যা</p>
      <p id="explanation-text" class="text-xs" style="color:#6B5A2E;"></p>
    </div>
    <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-5 py-3 rounded-full text-sm font-semibold btn-gold">পরের প্রশ্ন</button>
  </div>

  <!-- RESULT -->
  <div id="result-area" class="hidden px-5 mt-10 text-center">
    <i data-lucide="trophy" class="w-12 h-12 mx-auto mb-3" style="color:#C9A24C;"></i>
    <h2 class="serif-bn text-2xl mb-1" style="color:#0E211C;"><span id="final-score"></span></h2>
    <p class="text-sm mb-6" style="color:#5B5340;">সঠিক উত্তর</p>
    <div class="flex flex-col gap-3">
      <button onclick="location.reload()" class="py-3 rounded-full text-sm font-semibold btn-gold">আবার অনুশীলন করুন</button>
      <a href="index.html" class="py-3 rounded-full text-sm font-semibold" style="border:1px solid #C9A24C; color:#8B6B2A;">হোমে ফিরুন</a>
    </div>
  </div>

  <p id="no-questions" class="hidden px-5 mt-10 text-center text-sm" style="color:#8A8266;">এই বিভাগে এখনো কোনো প্রশ্ন যোগ করা হয়নি।</p>

<script>
  const SUPABASE_URL = "https://laujqfawcirnwsmvhaif.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rlZV0JZUFH7NdmR_-Oz7Dg_97OQxMpv";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let selectedSubject = null;
  let quizQuestions = [];
  let currentIndex = 0;
  let score = 0;

  function showEl(id){ document.querySelectorAll('#mode-select,#subject-picker,#count-picker,#quiz-area,#result-area,#no-questions').forEach(e=>e.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

  function goBack(){
    if (!document.getElementById('mode-select').classList.contains('hidden')) { window.location.href = 'index.html'; }
    else { showEl('mode-select'); }
  }

  async function showSubjectPicker(){
    showEl('subject-picker');
    const { data: subjectsData } = await sb.from('subjects').select('*').order('sort_order');
    const { data: questionsData } = await sb.from('questions').select('subject');
    const counts = {};
    (questionsData||[]).forEach(q => { counts[q.subject] = (counts[q.subject]||0) + 1; });

    const wrap = document.getElementById('subject-list');
    if (!subjectsData || subjectsData.length === 0) { wrap.innerHTML = `<p class="text-sm text-center py-6" style="color:#8A8266;">এখনো কোনো বিষয় যোগ করা হয়নি।</p>`; return; }
    wrap.innerHTML = subjectsData.map(s => {
      const count = counts[s.name] || 0;
      const disabled = count === 0;
      return `
      <button ${disabled ? 'disabled' : `onclick="pickSubject('${s.name.replace(/'/g,"\\'")}')"`} class="w-full text-left px-4 py-3 rounded-xl text-sm font-medium flex items-center justify-between" style="background:#fff; color:${disabled ? '#B8B096' : '#0E211C'};">
        <span>${s.name}</span>
        <span class="text-xs font-normal flex items-center gap-1" style="color:#8A8266;">${count > 0 ? count + 'টি প্রশ্ন' : 'শীঘ্রই আসছে'} <i data-lucide="chevron-right" class="w-4 h-4"></i></span>
      </button>`;
    }).join('');
    lucide.createIcons();
  }

  function pickSubject(subject){
    selectedSubject = subject;
    showCountPicker('subject');
  }

  function showCountPicker(mode){
    if (mode === 'random') selectedSubject = null;
    showEl('count-picker');
  }

  async function startQuiz(count){
    let query = sb.from('questions').select('*');
    if (selectedSubject) query = query.eq('subject', selectedSubject);
    const { data, error } = await query;
    if (error || !data || data.length === 0) { showEl('no-questions'); return; }

    const shuffled = data.sort(() => Math.random() - 0.5);
    quizQuestions = shuffled.slice(0, count);
    currentIndex = 0;
    score = 0;
    showEl('quiz-area');
    renderQuestion();
  }

  function renderQuestion(){
    const q = quizQuestions[currentIndex];
    document.getElementById('q-progress').textContent = `প্রশ্ন ${currentIndex+1} / ${quizQuestions.length}`;
    document.getElementById('q-score').textContent = `স্কোর: ${score}`;
    document.getElementById('progress-bar').style.width = `${(currentIndex/quizQuestions.length)*100}%`;
    document.getElementById('q-subject-tag').textContent = q.subject + (q.topic ? ' · ' + q.topic : '');
    document.getElementById('q-text').textContent = q.question;

    const options = [['a',q.option_a],['b',q.option_b],['c',q.option_c],['d',q.option_d]];
    const wrap = document.getElementById('options-wrap');
    wrap.innerHTML = options.map(([key,text]) => `
      <button data-key="${key}" onclick="selectAnswer('${key}')" class="opt-btn w-full text-left px-4 py-3 rounded-xl text-sm">${text}</button>`).join('');

    document.getElementById('explanation-box').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
    lucide.createIcons();
  }

  function selectAnswer(key){
    const q = quizQuestions[currentIndex];
    document.querySelectorAll('#options-wrap button').forEach(btn => {
      btn.onclick = null;
      const k = btn.dataset.key;
      if (k === q.correct) { btn.style.background = '#DFF3E3'; btn.style.borderColor = '#2F7A4F'; btn.style.color = '#1E5C36'; }
      else if (k === key) { btn.style.background = '#FBE2E2'; btn.style.borderColor = '#D14343'; btn.style.color = '#8C2020'; }
    });
    if (key === q.correct) score++;
    document.getElementById('q-score').textContent = `স্কোর: ${score}`;

    if (q.explanation) {
      document.getElementById('explanation-text').textContent = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion(){
    currentIndex++;
    if (currentIndex >= quizQuestions.length) {
      document.getElementById('final-score').textContent = `${score} / ${quizQuestions.length}`;
      showEl('result-area');
      lucide.createIcons();
      return;
    }
    renderQuestion();
  }

  lucide.createIcons();
</script>
</body>
</html>
